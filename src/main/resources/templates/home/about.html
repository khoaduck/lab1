<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${appName} + ' - Giới thiệu'">Giới thiệu</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
      }
      nav a {
        margin-right: 15px;
        text-decoration: none;
        color: #f26522;
        font-weight: bold;
      }
      nav a.active {
        border-bottom: 3px solid #f26522;
      }
      .message {
        background: #fff3e0;
        padding: 10px;
        border-left: 5px solid #f26522;
      }
    </style>
  </head>
  <body>
    <nav>
      <a th:href="@{/home/index}">Trang chủ</a>
      <a th:href="@{/home/about}" class="active">Giới thiệu</a>
      <a th:href="@{/home/help}">Trợ giúp</a>
    </nav>

    <h1 th:text="${appName}">App Name</h1>
    <p>Môn học: <b th:text="${subject}">Subject</b></p>
    <p>Học kỳ: <b th:text="${semester}">Semester</b></p>
    <p class="message" th:text="${message}">Message</p>

    <h2>Giới thiệu</h2>
    <p>
      Product Portal là ứng dụng web quản lý sản phẩm, xây dựng bằng Spring Boot MVC và Thymeleaf.
    </p>
  </body>
</html>
